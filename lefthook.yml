pre-commit:
  commands:
    react-doctor:
      glob:
        - "*.{ts,tsx,js,jsx,mjs,cjs}"
        - "**/*.{ts,tsx,js,jsx,mjs,cjs}"
      run: react_doctor_output=$(mktemp "${TMPDIR:-/tmp}/react-doctor-hook.XXXXXX"); if pnpm exec react-doctor --staged --blocking warning > "$react_doctor_output" 2>&1; then rm -f "$react_doctor_output"; else cat "$react_doctor_output" >&2; rm -f "$react_doctor_output"; printf "%s\n" "React Doctor found staged regressions." "Run pnpm exec react-doctor --staged --blocking warning to inspect." "Want them fixed? Ask your agent to run that command and resolve the findings." >&2; fi
  parallel: true
  jobs:
    # make sure env files are encrypted (skipped unless the file is staged)
    - run: pnpm dotenvx encrypt -f .env.production
      glob: ".env.production"
      stage_fixed: true
    - run: pnpm dotenvx encrypt -f .env.development
      glob: ".env.development"
      stage_fixed: true
    - run: pnpm ox:fix
      glob:
        - "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css}"
        - "**/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css}"
      stage_fixed: true
